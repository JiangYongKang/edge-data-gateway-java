# 边缘采集网关（本地模拟）
# 网关核心通过 GatewayProperties 以代码方式构造（测试与演示直接传参）；
# 下列键供 Spring 侧绑定参考。
spring.application.name=edge-data-gateway

# 缓冲数据目录（WAL: spool.wal，位点: buffer-state.json）
edge.gateway.data-dir=./data/edge-gateway
# 缓冲容量上限（达到后按溢出策略处理，绝不无界增长）
edge.gateway.buffer-capacity=1000
# 溢出策略：DROP_OLDEST（丢最旧未确认记录）或 REJECT_NEWEST（拒绝新记录）
edge.gateway.overflow-policy=DROP_OLDEST
# 采集与补传周期（毫秒）、补传批大小
edge.gateway.collect-interval-millis=100
edge.gateway.drain-interval-millis=50
edge.gateway.batch-size=100

# 演示/排障时打开归一化、拒绝、补传位点日志
logging.level.com.github.highcumontoa.edgedatagatewayjava=INFO
