# 边缘采集网关默认配置
spring.application.name=edge-data-gateway
server.port=8080

# 持久化目录（spool / checkpoints / 拒绝日志）
edge.gateway.data-dir=data/gateway
# 缓冲容量上限（未确认记录条数）
edge.gateway.spool-capacity=1000
# 每设备每轮采集最大条数
edge.gateway.poll-batch-size=5
# 采集 / 补传周期（毫秒）
edge.gateway.collect-interval-ms=200
edge.gateway.replay-interval-ms=200
# 启动时自动运行并装配内置演示设备
edge.gateway.auto-start=true
edge.gateway.demo-devices=true

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
